<rect x="275" y="166" width="292" height="124" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/>
<text x="421" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Sets up a scan</text>
<text x="421" y="222" text-anchor="middle" font-size="13.5" fill="#374151">Enters her product, picks up to 5</text>
<text x="421" y="243" text-anchor="middle" font-size="13.5" fill="#374151">categories (or searches any one),</text>
<text x="421" y="264" text-anchor="middle" font-size="13.5" fill="#374151">then clicks Generate</text>
<rect x="1645" y="166" width="292" height="124" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/>
<text x="1791" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Reaches out</text>
<text x="1791" y="222" text-anchor="middle" font-size="13.5" fill="#374151">Reads the list, drafts a message,</text>
<text x="1791" y="243" text-anchor="middle" font-size="13.5" fill="#374151">copies it, opens the product's</text>
<text x="1791" y="264" text-anchor="middle" font-size="13.5" fill="#374151">page or X, marks them contacted</text>
<rect x="618" y="346" width="292" height="124" rx="12" fill="#fff" stroke="#4338ca" stroke-width="3"/>
<text x="764" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Checks the request</text>
<text x="764" y="402" text-anchor="middle" font-size="13.5" fill="#374151">Max 5 categories, safe topic names,</text>
<text x="764" y="423" text-anchor="middle" font-size="13.5" fill="#374151">7-day window. Bad input gets a</text>
<text x="764" y="444" text-anchor="middle" font-size="13.5" fill="#374151">clear error message</text>
<rect x="1302" y="346" width="292" height="124" rx="12" fill="#fff" stroke="#4338ca" stroke-width="3"/>
<text x="1448" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Scores and ranks (code)</text>
<text x="1448" y="402" text-anchor="middle" font-size="13.5" fill="#374151">60% upvotes + 40% maker comments.</text>
<text x="1448" y="423" text-anchor="middle" font-size="13.5" fill="#374151">Thank-you replies count 0.3.</text>
<text x="1448" y="444" text-anchor="middle" font-size="13.5" fill="#374151">Zero-maker launches stay, 0 pts</text>
<rect x="1645" y="346" width="292" height="124" rx="12" fill="#fff" stroke="#4338ca" stroke-width="3"/>
<text x="1791" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Ranked list (top 50)</text>
<text x="1791" y="402" text-anchor="middle" font-size="13.5" fill="#374151">20 shown, then 10 more. Founder,</text>
<text x="1791" y="423" text-anchor="middle" font-size="13.5" fill="#374151">upvotes, days since launch, angle</text>
<text x="1791" y="444" text-anchor="middle" font-size="13.5" fill="#374151">and score breakdown</text>
<rect x="618" y="526" width="292" height="124" rx="12" fill="#fff" stroke="#0f766e" stroke-width="3"/>
<text x="764" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Saved snapshot</text>
<text x="764" y="582" text-anchor="middle" font-size="13.5" fill="#374151">Real launches saved earlier. Used</text>
<text x="764" y="603" text-anchor="middle" font-size="13.5" fill="#374151">only if the live API fails, with a</text>
<text x="764" y="624" text-anchor="middle" font-size="13.5" fill="#374151">banner on screen</text>
<rect x="960" y="526" width="292" height="124" rx="12" fill="#fff" stroke="#0f766e" stroke-width="3"/>
<text x="1106" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Live launches + comments</text>
<text x="1106" y="582" text-anchor="middle" font-size="13.5" fill="#374151">Last 7 days per category (paged),</text>
<text x="1106" y="603" text-anchor="middle" font-size="13.5" fill="#374151">then the latest 40 comments for</text>
<text x="1106" y="624" text-anchor="middle" font-size="13.5" fill="#374151">the top 60 launches by upvotes</text>
<rect x="1302" y="706" width="292" height="124" rx="12" fill="#fff" stroke="#7e22ce" stroke-width="3"/>
<text x="1448" y="736" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Writes angles + drafts</text>
<text x="1448" y="762" text-anchor="middle" font-size="13.5" fill="#374151">One-liner and outreach angle per</text>
<text x="1448" y="783" text-anchor="middle" font-size="13.5" fill="#374151">launch. A quote must match their</text>
<text x="1448" y="804" text-anchor="middle" font-size="13.5" fill="#374151">own text word for word, else plain</text>
<rect x="1645" y="886" width="292" height="124" rx="12" fill="#fff" stroke="#475569" stroke-width="3"/>
<text x="1791" y="916" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Remembers who she contacted</text>
<text x="1791" y="942" text-anchor="middle" font-size="13.5" fill="#374151">Saved in her browser. Shown in the</text>
<text x="1791" y="963" text-anchor="middle" font-size="13.5" fill="#374151">Contacted tab, hidden from the list</text>
<text x="1791" y="984" text-anchor="middle" font-size="13.5" fill="#374151">even after a refresh or new search</text>
<rect x="629.3" y="216" width="72.4" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="665.5" y="232.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">request</text>
<rect x="961" y="396" width="94" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1008" y="412.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">categories</text>
<rect x="1198.6" y="486" width="158.8" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1278" y="502.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">launches + comments</text>
<rect x="1342.2" y="536" width="115.60000000000001" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1400" y="552.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">text to quote</text>
<rect x="1442.2" y="613" width="115.60000000000001" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1500" y="629.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">angle + quote</text>
<rect x="1765.6" y="306" width="50.8" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1791" y="322.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">list</text>
<rect x="1682.2" y="608" width="115.60000000000001" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1740" y="624.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">draft message</text>
<rect x="1788.6" y="688" width="122.8" height="24" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1850" y="704.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">mark contacted</text>
<text x="1000" y="1082" text-anchor="middle" font-size="14" fill="#475569">dashed arrow = data / action flow  ·  grey = fallback path  ·  Product Hunt token and Gemini key stay on the server, never in the browser</text>
